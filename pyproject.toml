[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "master-of-soccer"
version = "0.1.0"
description = "MoS: Master of Soccer — experimental BFM latent soccer control"
requires-python = ">=3.11"
dependencies = ["torch", "onnx", "onnxruntime", "onnx2torch", "numpy"]
[project.optional-dependencies]
train = ["swanlab"]
test = ["pytest"]
video = ["mujoco", "imageio[ffmpeg]", "Pillow"]

[tool.setuptools.packages.find]
where = ["src"]
